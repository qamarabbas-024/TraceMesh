<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceMesh // OSINT Expansion Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #07090e; color: #e2e8f0; font-family: ui-monospace, monospace; }
    .glow { box-shadow: 0 0 20px rgba(6, 182, 212, 0.25); }
  </style>
</head>
<body class="p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-cyan-500/30 pb-4">
      <div>
        <h1 class="text-xl font-bold text-cyan-400">TRACEMESH // OSINT EXPANSION SUITE</h1>
        <p class="text-xs text-slate-400">Version 2.0.0 — Unified Threat Intelligence Gateway</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
        <span class="text-xs text-emerald-400">ONLINE :3001</span>
      </div>
    </header>

    <!-- Query Box -->
    <div class="bg-slate-900/80 border border-cyan-500/30 rounded-lg p-5 glow">
      <div class="flex gap-3">
        <input id="targetInput" type="text" placeholder="Enter Email, Domain, IP, BTC Address, or Username..." class="flex-1 bg-slate-950 border border-cyan-500/40 rounded px-4 py-2 text-sm text-cyan-200 outline-none focus:border-cyan-400">
        <button onclick="runRecon()" class="px-6 py-2 bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold text-sm rounded hover:bg-cyan-400 hover:text-black transition-all">EXECUTE</button>
      </div>
    </div>

    <!-- Live Telemetry Results -->
    <div class="bg-slate-900/80 border border-cyan-500/30 rounded-lg p-5 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs uppercase tracking-wider text-cyan-400 font-bold">Investigation Telemetry Output</span>
        <span id="duration" class="text-xs text-slate-400">0ms</span>
      </div>
      <pre id="output" class="bg-slate-950 border border-slate-800 rounded p-4 text-xs text-slate-300 overflow-x-auto h-96">Awaiting operator query...</pre>
    </div>
  </div>

  <script>
    async function runRecon() {
      const input = document.getElementById('targetInput').value.trim();
      if (!input) return;
      document.getElementById('output').textContent = 'Scanning across parallel OSINT modules...';
      const start = Date.now();
      try {
        let endpoint = '/api/v2/domain/recon';
        let body = { domain: input };
        if (input.includes('@')) {
          endpoint = '/api/v2/email/recon';
          body = { email: input };
        } else if (/^[0-9.]+$/.test(input)) {
          endpoint = '/api/v2/ip/recon';
          body = { ip: input };
        }
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        document.getElementById('duration').textContent = (Date.now() - start) + 'ms';
      } catch (err) {
        document.getElementById('output').textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
